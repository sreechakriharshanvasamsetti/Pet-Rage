<style>
/* Layout: full-bleed 3D canvas; glass HUD on top; menu is a two-pane picker (animal grid + live preview info). */
:root{--bg:#bfe6ff;--ink:#27304a;--card:rgba(255,255,255,.86);--card2:#ffffff;--accent:#ff7a3d;--accent2:#2fb5a0;--gold:#ffc83a;--bad:#ff5a6e;--line:rgba(39,48,74,.14);

 #chasebox{width:100%;order:3}#top{gap:6px}.sub{font-size:11px}#grid{grid-template-columns:repeat(4,1fr)}.card{font-size:10px}}
@media (prefers-reduced-motion:reduce){#banner,.bar>i{transition:none}#abbox.ready .bar>i{animation:none}}

<script>
'use strict';
/* ===== utils ===== */
const TAU=Math.PI*2, PI=Math.PI;

/* textures */
const _tex={};
function radialTex(){if(_tex.rad)return _tex.rad;const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');

  x.font='64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,48,52);
  const t=new THREE.CanvasTexture(c);return _tex[k]=t;}
function pawTex(col){const k='p'+col;if(_tex[k])return _tex[k];const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle=col;x.beginPath();x.ellipse(64,82,26,21,0,0,TAU);x.fill();
  [[30,52,10,13],[50,32,10,14],[78,32,10,14],[98,52,10,13]].forEach(p=>{x.beginPath();x.ellipse(p[0],p[1]+2,p[2],p[3],0,0,TAU);x.fill();});
  return _tex[k]=new THREE.CanvasTexture(c);}

/* ===== Rig: cute chibi character base ===== */
const EXP={happy:{ey:1,es:1,b:0,by:0,m:'s'},joy:{ey:.14,es:1.2,b:0,by:0,m:'o'},shock:{ey:1.15,es:1.35,b:.35,by:.3,m:'o'},
  det:{ey:.75,es:1,b:-.55,by:-.05,m:'f'},sly:{ey:.6,es:1,b:-.4,by:-.05,m:'s'},sad:{ey:.9,es:1,b:.5,by:.1,m:'f'},boost:{ey:.7,es:1.05,b:-.45,by:0,m:'o'}};
const _v3=new THREE.Vector3(),_e=new THREE.Euler();
class Rig{
  constructor(){

    this.mats=[];this.om=new THREE.MeshBasicMaterial({color:0x2e2535,side:THREE.BackSide});this.mats.push(this.om);
    this.legs=[];this.arms=[];this.wings=[];this.fins=[];this.tent=[];this.ears=[];this.tails=[];this.eyes=[];this.brows=[];
    this.head=null;this.cap=null;this.capT=-1;this.ph=Math.random()*6;this.ex=EXP.happy;this.blink=0;this.blinkT=2;
    this.eyeS=1;this.eyeY=1;this.browA=0;this.browY=0;this.lookT=0;this.capSpec={r:.6,s:[1.1,1,1],y:0,z:0};this.packPos=[0,1,.5];this.family='';this.opacity=1;this.pack=null;this.treasure=null;this.size=1;

  m(c){const m=new THREE.MeshToonMaterial({color:c,gradientMap:GRAD});this.mats.push(m);return m;}
  ball(p,r,c,x=0,y=0,z=0,sx=1,sy=1,sz=1,ol=true){
    const m=new THREE.Mesh(SPH,this.m(c));m.scale.set(r*sx,r*sy,r*sz);m.position.set(x,y,z);m.castShadow=true;
    if(ol){const o=new THREE.Mesh(SPH,this.om);o.scale.setScalar(1.07);m.add(o);}
    p.add(m);return m;}
  cone(p,r,h,c,x=0,y=0,z=0,rx=0,ry=0,rz=0,ol=true){
    const m=new THREE.Mesh(CONE,this.m(c));m.scale.set(r,h,r);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=true;
    if(ol){const o=new THREE.Mesh(CONE,this.om);o.scale.set(1.12,1.04,1.12);m.add(o);}p.add(m);return m;}
  box(p,w,h,d,c,x=0,y=0,z=0){const m=new THREE.Mesh(BOX,this.m(c));m.scale.set(w,h,d);m.position.set(x,y,z);p.add(m);return m;}
  limb(p,x,y,z,len,r,c,fc){
    const g=new THREE.Group();g.position.set(x,y,z);p.add(g);
    this.ball(g,r,c,0,-len*.5,0,1,Math.max(1,len/(2*r)),1);

    const eyeC=o.eyeC||0x2a1d22;
    if(o.patch){[-1,1].forEach(s=>{const px=s*hr*sx*ex,py=hr*sy*ey;
      this.ball(head,hr*.3,o.patch,px,py-hr*.02,surf(px,py)+hr*.04,.85,1.15,.35,false).rotation.z=-s*.5;});}
    if(o.mask){const y=hr*sy*ey;this.ball(head,hr*.32,o.mask,0,y,surf(0,y)+hr*.02,2.25,.78,.3,false);}
    this.eyes=[];this.eyeBase=[];
    [-1,1].forEach(s=>{const px=s*hr*sx*ex,py=hr*sy*ey;
      const g=new THREE.Group();g.position.set(px,py,surf(px,py)+er*.55);head.add(g);
      this.ball(g,er,eyeC,0,0,0,.92,1.12,.7,false);
      this.ball(g,er*.36,0xffffff,er*.28,er*.42,-er*.55,1,1,.6,false);
      this.ball(g,er*.17,0xffffff,-er*.3,-er*.32,-er*.6,1,1,.6,false);
      this.eyes.push(g);
      const br=this.ball(head,hr*.2,o.browC||0x3a2a2a,px,py+er*1.7,surf(px,py+er*1.7)+hr*.03,1,.16,.2,false);br.visible=false;br.userData.by=py+er*1.7;this.brows.push(br);});
    // cheeks
    if(o.cheek!==null){const cc=o.cheek||0xff9fa8;[-1,1].forEach(s=>{const px=s*hr*sx*(o.cheekX||.64),py=-hr*sy*.22;

    // muzzle + nose + mouth

    if(o.muzzle!==null&&o.muzzle!==undefined){this.ball(head,hr*.34,o.muzzle,0,my,surf(0,my)+hr*.12,1.15,.8,.85);}
    if(o.nose!==null){const nc=o.nose||0x3b2a2a;const ny=my+hr*.12;this.ball(head,hr*.085,nc,0,ny,surf(0,ny)-hr*.12+hr*.17*.0-.0+hr*.0-hr*.0+0,1.2,.85,.8,false).position.z=surf(0,my)-hr*.12;}

// ===== COMPAT: bridges the Rig/animals data model to the game loop (old M.* API) =====
const M = {};
M.mat = (c, o) => lam(c, o);
const _SUPER = {panda:'Golden Bamboo', rabbit:'Turbo Carrot', kangaroo:'Turbo Carrot', monkey:'Lightning Berry',
  dolphin:'Ocean Pearlfruit', shark:'Golden Fish', penguin:'Golden Fish', octopus:'Golden Fish', turtle:'Ocean Pearlfruit', otter:'Golden Fish',
  parrot:'Sky Fruit', bluebird:'Sky Fruit', bat:'Wind Melon', butterfly:'Wind Melon', eagle:'Wind Melon', owl:'Sky Fruit', squirrel:'Rainbow Acorn'};
const _TCOL = {hare:0xb59a7a, monkey:0x8a5a34, fox:0xf08a3a, squirrel:0xc8703a, raccoon:0x7a7f8a, crow:0x2c2c3a, parrot:0x3ad47a, seal:0x8f98a8, otter:0x8a6040, fish:0xff9a2a, crab:0xe0503a};
const _HAB = {moonwood:'moonforest', foxwoods:'woods', pride:'savanna2', alps:'mountain', nightsky:'nightwood', blossom:'bloom', enchanted:'garden2', reef:'coral', polar:'ice', seagarden:'garden3'};
ANIMALS.forEach(a => {
  a.hab = _HAB[a.hab] || a.hab;
  a.treasure = a.tr.name; a.ability = a.ab.name; a.thiefId = a.thief;
  const T = THIEVES[a.thiefId]; a.thief = T.name; a.power = T.power.name; a.thiefCol = _TCOL[a.thiefId] || 0x8a6040;
  a.food = _SUPER[a.id] || (a.mode === 'fly' ? 'Sky Fruit' : a.mode === 'swim' ? 'Golden Fish' : 'Lightning Berry');
});
M.build = (a) => {
  const R = a.build ? buildAnimal(a) : buildThief(a.id);
  const r = R.root; r.userData.rig = R; r.userData.mode = a.mode; r.userData.emT = 0;
  r.userData.parts = { head: R.head || r, cap: R.cap || { visible: false } };
  if (R.cap) R.hideCap();
  return r;
};
M.setCap = (o, on, anim) => { const R = o.userData.rig; if (!R || !R.cap) return; on ? R.showCap(!!anim) : R.hideCap(); };
M.emote = (o, n) => { const R = o.userData.rig; if (!R) return; R.setExpr(n === 'cheer' ? 'joy' : n === 'determined' ? 'det' : n); o.userData.cheer = n === 'cheer'; o.userData.emT = 1.8; };
M.animate = (o, dt, p = {}) => {
  const R = o.userData.rig; if (!R) return;
  const u = o.userData;
  if (u.emT > 0) { u.emT -= dt; if (u.emT <= 0) { u.cheer = false; R.setExpr(u.chasing ? 'det' : 'happy'); } }
  const sp = p.speed === undefined ? 1 : p.speed;
  R.update(dt, { mode: u.mode, spd: sp, idle: sp < .15, cheer: !!u.cheer, air: !!p.airborne, slide: !!(p.sliding || p.rolling),
    vx: (p.bank || 0) * 9, vy: (p.pitch || 0) * 9, boost: !!p.boost, dive: !!p.dive });
};

W.update = (dt, z, camPos) => {

  const fogC = new THREE.Color(T.fog).lerp(new THREE.Color(T.night[1]),W.night*.9).lerp(grey,W.weather*.2);

  W.scene.background = fogC;
  W.hemi.intensity = 1.0 - W.night*.5; W.sun.intensity = .9*(1-W.night*.8)*(1-W.weather*.4);
  W.hemi.color.set(0xffffff).lerp(new THREE.Color(0x8aa0ff),W.night*.6);

    L.scale.set(hs/2,2*R,3); L.position.set(nx-R-hs/4,ny,0); Rr.scale.set(hs/2,2*R,3); Rr.position.set(nx+R+hs/4,ny,0); ring.position.set(nx,ny,1.6);
    g.position.set(0,0,z); mk({t:'gate',m:g,z,hx:nx,hy:ny,R}); }
  else { const m=acquire('pillar'+W.key,()=>{const gg=new THREE.Group(); gg.add(W.m('cyl',swim?0xff8ad0:0x8a7a6a,0,7,0,2.4,16,2.4)); return gg;}); const px=Math.random()<.5?-1:1; const x=px*rnd(1,5); m.position.set(x,0,z); mk({t:'pillar',m,z,x,mover:Math.random()<.5,ph:Math.random()*6,r:1.4}); S.lastHole={x:-x*.6,y:5}; }
  S.spawnPickups(z+10);
};
S.spawnPickups=(z)=>{
  const mode=S.animal.mode, vol=mode!=='ground', r=Math.random();
  const cx=vol?S.lastHole.x:(((Math.random()*3)|0)-1)*LANE, cy=vol?S.lastHole.y:0;
  if(r<.5){ for(let i=0;i<5;i++){ const m=acquire('coin',()=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.1,14),M.mat(0xffd23a,{emissive:0x886600})); c.rotation.x=Math.PI/2; const g=new THREE.Group(); g.add(c); return g;}); mk({t:'coin',m,z:z-i*2.4,x:cx+(vol?Math.sin(i*.8)*1.2:0),y:(vol?cy:1)+(vol?Math.cos(i*.8)*.6:0)}); } }
  else if(r<.8){ const e=pick(FOOD_EMO[mode]); const m=acquire('food'+e,()=>sprite(e,'#ffffff',1.5)); mk({t:'food',m,z,x:cx,y:(vol?cy:1.1)}); }
};
S.spawnSuper=(z)=>{ const mode=S.animal.mode, vol=mode!=='ground'; const kind=pick(SUPERKINDS); const e=kind==='extend'?'🥭':kind==='energy'?'🌸':SUPER_EMO(S.animal.food); const m=acquire('super'+e,()=>{ const g=sprite(e,'#ffd23a',2.4); return g; });
  mk({t:'super',kind,m,z,x:vol?rnd(-4,4):(((Math.random()*3)|0)-1)*LANE,y:vol?rnd(2.5,8):1.3}); };
S.spawnPower=(z)=>{ const mode=S.animal.mode, vol=mode!=='ground'; let keys=Object.keys(POWERS); const k=pick(keys); const P=POWERS[k]; const m=acquire('pow'+k,()=>sprite(P.e,P.c,2.8)); mk({t:'power',kind:k,m,z,x:vol?rnd(-4,4):(((Math.random()*3)|0)-1)*LANE,y:vol?rnd(2.5,8):1.5}); };
S.spawnZone=(z)=>{ const mode=S.animal.mode; const opts={ground:['mud','grass'],fly:['wind','thermal'],swim:['current','mist']}[mode]; const type=pick(opts); const len=45; const colors={mud:0x6a4a2a,grass:0x7acf5a,wind:0xffffff,thermal:0xffb86a,current:0x6af0ff,mist:0xffffff};
  const m=acquire('zone'+type,()=>{ let g; if(type==='mud'){ g=new THREE.Mesh(new THREE.PlaneGeometry(9,len),M.mat(colors[type])); g.rotation.x=-Math.PI/2; g.position.y=.05; }
    else if(type==='grass'){ g=new THREE.Group(); for(let i=0;i<60;i++) g.add(W.m('cone',pick([0x7acf5a,0x9ae070,0x6ab84a]),rnd(-5,5),1.2,-rnd(0,len),.2,rnd(2,3.4),.2)); }
    else { g=new THREE.Mesh(new THREE.BoxGeometry(18,12,len),new THREE.MeshBasicMaterial({color:colors[type],transparent:true,opacity:type==='mist'?.35:.12,depthWrite:false})); g.position.y=5; }
    const w=new THREE.Group(); w.add(g); if(type==='mud'||type==='grass'||true) {} return w; });
  m.position.set(0,0,z-len/2); if(type==='grass') m.position.z=z; 
  const warn=sprite({mud:'🟤',grass:'🌾',wind:'💨',thermal:'🔺',current:'🌊',mist:'🌫️'}[type],'#ffffff',3); warn.position.set(0,4,z+35); S.scene.add(warn);
  S.zones.push({type,z0:z,z1:z-len,m,warn,len}); };

S.updateSpawns=(dt)=>{ const pz=S.P.z, ahead=pz-170;
  while(S.nextSpawn>ahead){ const z=S.nextSpawn; (S.animal.mode==='ground'?S.spawnGround:S.spawnFlySwim)(z); const base=S.animal.mode==='ground'?26:34; S.nextSpawn-= Math.max(base*.5, base-S.dist/200*3)+rnd(0,8); }
  while(S.nextSuper>ahead){ S.spawnSuper(S.nextSuper); S.nextSuper-=rnd(150,260); }
  while(S.nextPower>ahead){ S.spawnPower(S.nextPower); S.nextPower-=rnd(300,520); }
  while(S.nextZone>ahead){ S.spawnZone(S.nextZone); S.nextZone-=rnd(380,640); }
  for(let i=S.zones.length-1;i>=0;i--){ const q=S.zones[i]; if(q.z1>pz+20){ release(q.m); S.scene.remove(q.warn); S.zones.splice(i,1);} }
};
// ===== GAME PART B: effects, powers, hits, thief, chase phases =====
S.say=(t,ms=1800,cls='')=>{ const el=document.getElementById('banner'); if(!el) return; el.textContent=t; el.className='show '+cls; clearTimeout(S._bt); S._bt=setTimeout(()=>el.className='',ms); };
// spark particles
S.sparks=[]; S.burst=(p,col,n=10,spd=4,size=.35)=>{ for(let i=0;i<n;i++){ let s=S.sparks.find(q=>!q.on); if(!s){ if(S.sparks.length>120) return; const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:iconTex('','#fff'),transparent:true,depthWrite:false,fog:false})); s={s:sp,on:false,v:new THREE.Vector3(),life:0}; S.sparks.push(s); }
  s.on=true; s.life=.6+Math.random()*.4; s.s.material.color.set(col); s.s.position.copy(p); s.s.scale.set(size,size,1); s.v.set(rnd(-1,1)*spd,rnd(-.3,1)*spd,rnd(-1,1)*spd); S.scene.add(s.s); } };
S.updateSparks=(dt)=>{ S.sparks.forEach(s=>{ if(!s.on) return; s.life-=dt; s.s.position.addScaledVector(s.v,dt); s.v.multiplyScalar(.96); s.s.material.opacity=Math.max(0,s.life*1.6); if(s.life<=0){ s.on=false; S.scene.remove(s.s);} }); };

S.addScore=(n,label)=>{ const m=(S.fx.star>0?2:1)*(1+Math.min(4,Math.floor(S.combo/8))); S.score+=n*m; };
S.setGhost=(on)=>{ S.model.traverse(o=>{ if(o.isMesh){ o.material.transparent=on; o.material.opacity=on?.45:1; } }); };
S.activate=(k)=>{ const P=POWERS[k], up=S.save.up; const mult=1+0.2*(k==='shield'?up.shield:k==='magnet'?up.magnet:k==='boots'||k==='wings'||k==='aqua'?up.boost:0);
  if(k==='phoenix'){ S.fx.phoenix=1; } else { S.fx[k]=P.dur*mult; S.fxMax=S.fxMax||{}; S.fxMax[k]=S.fx[k]; }
  if(k==='shield'){ S.shieldMesh.visible=true; A.sfx('shield'); } else if(k==='ghost'){ S.setGhost(true); A.sfx('power'); } else A.sfx('power');
  S.say(pname(k)+'!',1400); S.burst(S.model.position.clone().add(new THREE.Vector3(0,1.5,0)),P.c,18,5); };
S.endFx=(k)=>{ if(k==='shield') S.shieldMesh.visible=false; if(k==='ghost') S.setGhost(false); A.sfx('expire'); };

S.speedMult=()=>{ const f=S.fx, m=S.animal.mode; let x=1; if(f.boost>0) x+=.35; if(f.boots>0) x+=.4; if(f.wings>0) x+=(m==='fly'?.4:.25); if(f.aqua>0) x+=(m==='swim'?.4:.25); if(f.dash>0) x+=.5;
  x=Math.min(1.95,x); const z=S.inZone('mud'); if(z&&!(f.boots>0||f.ghost>0||f.dash>0)) x*=.65; if(S.inZone('current')) x*=1.3; if(S.inZone('thermal')) x*=1.12; return x; };
S.inZone=(t)=>S.zones.some(q=>q.type===t&&S.P.z<q.z0&&S.P.z>q.z1);

S.hit=(o)=>{ const t=performance.now()/1000;
  if(S.fx.ghost>0||S.fx.dash>0||t-S.lastHit<1.4) return;
  const pos=S.model.position.clone().add(new THREE.Vector3(0,1,-1));
  if(S.fx.shield>0){ S.burst(pos,'#6ad0ff',24,7); A.sfx('hit'); S.combo+=1; S.addScore(30); if(o.m){ o.dead=true; } S.shake=.3; return; }
  S.lastHit=t; S.shake=.7; S.combo=0; A.sfx('hit'); S.burst(pos,'#ff8a8a',20,6); M.emote(S.model,'shock');
  if(S.fx.phoenix){ S.fx.phoenix=0; S.fx.ghost=2.5; S.setGhost(true); S.say('Phoenix Feather saved you!',2000,'good'); S.burst(pos,'#ff8a3a',40,8); return; }
  S.hearts--; S.assist=Math.min(1,S.assist+.5); S.speedDip=1.0; if(S.thief) S.thief.gap+=4;
  if(S.hearts<=0) S.gameOver(); };

S.collect=(o)=>{ const p=o.m.position.clone(); const c=o.t;
  if(c==='coin'){ A.sfx('coin'); S.runCoins++; S.addScore(10); S.combo++; S.burst(p,'#ffd23a',4,2,.25); }
  else if(c==='food'){ A.sfx('food'); S.foods++; S.addScore(50); S.abilityMeter=Math.min(100,S.abilityMeter+10); S.combo++; S.burst(p,'#ffffff',8,3); S.model.userData.parts.head.scale.setScalar(1.15); }
  else if(c==='super'){ A.sfx('super'); S.addScore(250); S.combo+=3; S.foods++;
    if(o.kind==='speed'){ S.fx.boost=8*(1+.2*S.save.up.boost); S.say(S.animal.food+'! Speed boost',1600,'good'); }
    else if(o.kind==='extend'){ S.fx.extend=1; S.abilityMeter=100; for(const k in S.fx){ if(S.fx[k]>0&&k!=='extend') S.fx[k]+=4; } S.say('Power Mango! Effects extended',1600,'good'); }
    else { S.abilityMeter=100; S.fx.boost=Math.max(S.fx.boost||0,2.5); S.say('Energy Flower! Ability restored',1600,'good'); }
    S.burst(p,'#ffd23a',24,6,.5); }
  else if(c==='power'){ S.activate(o.kind); S.addScore(150); }
  o.dead=true; };

// ---------- chase phases ----------
const THIEF_POOL=()=>{ const cur=S.thief&&S.thief.def.id; const ids=Object.keys(THIEVES).filter(k=>THIEVES[k].mode===S.animal.mode&&k!==cur&&k!==S.animal.thiefId); const id=pick(ids.length?ids:Object.keys(THIEVES)); const o=pick(ANIMALS.filter(x=>x.id!==S.animal.id)); return {id,name:THIEVES[id].name,col:_TCOL[id]||0x8a6040,power:THIEVES[id].power.name,treasure:o.tr.name,tr:o.tr}; };
S.beginChase=()=>{ const first=S.chase===0; const a=S.animal; const t=first?{id:a.thiefId,name:a.thief,col:a.thiefCol,power:a.power,treasure:a.treasure,tr:a.tr}:THIEF_POOL();
  if(S.thiefModel){ S.scene.remove(S.thiefModel); } if(S.gem){ S.scene.remove(S.gem); }
  const tm=M.build({id:t.id,mode:a.mode}); tm.scale.setScalar(.85); tm.userData.chasing=true; S.thiefModel=tm; S.scene.add(tm);
  const gem=new THREE.Group(); const tr=makeTreasure(t.tr.kind,t.tr.col); tr.scale.setScalar(1.15); gem.add(tr); gem.add(sprite('✨','#ffe58a',2));
  S.gem=gem; S.scene.add(gem);
  S.thief={def:t,gap:18,power:0,cd:7+Math.random()*3,tired:0,laneT:0,lane:0,hidden:false,wob:0};
  S.chase++; S.phase='intro'; S.phaseT=0; S.stolen=false; S.capDone=!first; M.setCap(S.model,!first,false);
  document.getElementById('treasureName').textContent=t.treasure; document.getElementById('thiefName').textContent=t.name; };

S.updateIntro=(dt)=>{ const T=S.phaseT+=dt, P=S.P, th=S.thief, tm=S.thiefModel; const vol=S.animal.mode!=='ground'; const base=vol?P.y:0;
  const gemHome=new THREE.Vector3(2,base+1.8,P.z-2);
  if(T<1.3){ const k=T/1.3; tm.position.set(7-5.4*k, base+(vol?1:0), P.z-4-1*k); tm.rotation.y=Math.PI/2+0.4; S.gem.position.copy(gemHome).add(new THREE.Vector3(0,Math.sin(T*3)*.15,0)); S.gem.rotation.y=T*2; if(T>.3) S.say(S.animal.name+' guards '+th.def.treasure,1200); }
  else { if(!S.stolen){ S.stolen=true; A.sfx('steal'); M.emote(S.model,'shock'); S.say(th.def.name+' stole the '+th.def.treasure+'!',2400,'bad'); S.shake=.4; S.burst(gemHome,'#ffffff',16,5); }
    const k=Math.min(1,(T-1.3)/1.5), e=k*k; th.gap=2+e*16; tm.position.set(1.6+(P.x-1.6)*e, base+(vol?1:0)+Math.abs(Math.sin(T*10))*.3, P.z-th.gap); tm.rotation.y=Math.PI*(1-e)*.5; S.gem.position.set(tm.position.x,tm.position.y+1.9,tm.position.z+.2);
    if(T>2.2&&!S.capDone){ S.capDone=true; M.setCap(S.model,true,true); S.capPop=.6; A.sfx('power'); S.say('Cap on! Time to chase!',1600,'good'); S.burst(S.model.position.clone().add(new THREE.Vector3(0,2.4,0)),'#ffffff',20,5); M.emote(S.model,'determined'); }
    if(T>3.1){ S.phase='chase'; document.body.classList.add('chasing'); S.say('GO!',900,'good'); } }
  M.animate(S.model,dt,{speed:T<1.3?0:1.2}); M.animate(tm,dt,{speed:T<1.3?.5:1.5}); };

S.updateThief=(dt)=>{ const th=S.thief, P=S.P, tm=S.thiefModel, base=S.baseSpeed, vol=S.animal.mode!=='ground'; th.t=(th.t||0)+dt;
  // superpower cycle
  let sp=.94*(1-S.assist*.08);
  if(th.power>0){ th.power-=dt; sp=1.32; if(th.power<=0){ th.tired=4.5; th.cd=9+Math.random()*4; } }
  else if(th.tired>0){ th.tired-=dt; sp=.8; }
  else { th.cd-=dt; if(th.cd<=0){ th.power=3.4; A.sfx('thiefpow'); S.say(th.def.name+' uses '+th.def.power+'!',1800,'bad'); S.burst(tm.position,'#ffe58a',24,6); } }
  if(th.gap>48) sp*=.85;                                   // rubber band
  th.gap+= (sp*base-S.speed)*dt; th.gap=Math.max(1,Math.min(70,th.gap));
  // weave shrinks as gap closes so the thief can be caught by skill
  const k=Math.min(1,Math.max(0,(th.gap-3)/22));
  th.laneT-=dt; if(th.laneT<=0){ th.laneT=1+Math.random()*1.4; th.lane=((Math.random()*3)|0)-1; }
  let tx,ty;
  if(!vol){ tx=P.x+(th.lane*LANE-P.x)*k; ty=Math.abs(Math.sin(th.t*(th.power>0?9:6)))*(th.power>0?1.4:.6); }
  else { tx=P.x+Math.sin(th.t*.9)*5*k; ty=Math.max(1.5,Math.min(8.5,P.y+Math.cos(th.t*.7)*2.6*k)); }
  tm.position.x+=(tx-tm.position.x)*Math.min(1,dt*5); tm.position.y+=(ty-tm.position.y)*Math.min(1,dt*6); tm.position.z=P.z-th.gap; tm.rotation.y=Math.PI+(tm.position.x-tx)*.1;
  S.gem.position.set(tm.position.x,tm.position.y+(vol?2.1:2.2),tm.position.z+.3); S.gem.rotation.y+=dt*3; S.gem.children[1].rotation.x+=dt*2;
  // tall grass / mist hides the thief unless the compass is active
  const hid=(S.zones.some(q=>(q.type==='grass'||q.type==='mist')&&tm.position.z<q.z0+2&&tm.position.z>q.z1-2))&&!(S.fx.compass>0);
  tm.visible=!hid; S.gem.visible=!hid; th.hidden=hid;
  M.animate(tm,dt,{speed:th.power>0?1.7:1,airborne:ty>.8&&!vol,bank:0});
  // catch
  const dx=Math.abs(tm.position.x-P.x), dy=Math.abs(tm.position.y-P.y);
  if(th.gap<3.2 && dx<2.3 && (!vol||dy<2.5)) S.catchThief(); };

S.catchThief=()=>{ S.phase='recover'; S.phaseT=0; document.body.classList.remove('chasing'); A.sfx('win'); const bonus=1000*S.chase+Math.floor(S.dist/10); S.addScore(bonus); S.combo+=5; S.recovered=S.thief.def.treasure;
  S.say('Caught '+S.thief.def.name+'! +'+bonus.toLocaleString(),2600,'good'); M.emote(S.model,'cheer'); S.burst(S.thiefModel.position.clone().add(new THREE.Vector3(0,2,0)),'#ffd23a',50,9,.5); S.thiefModel.visible=true; };
S.updateRecover=(dt)=>{ const T=S.phaseT+=dt, P=S.P, tm=S.thiefModel; S.gem.visible=true;
  const target=new THREE.Vector3(P.x,P.y+2.6,P.z-.5); S.gem.position.lerp(target,Math.min(1,dt*3)); S.gem.rotation.y+=dt*6; tm.position.z-=dt*18; tm.position.y+=dt*3; tm.rotation.y+=dt*10; tm.scale.multiplyScalar(1-dt*.6);
  S.speed=S.baseSpeed*.8; M.animate(S.model,dt,{speed:1}); 
  if(T>2.4){ S.gem.visible=false; S.beginChase(); } };
// ===== GAME PART C: renderer, input, main loop, menu/HUD hooks =====
S.P={x:0,y:0,z:0,vy:0,lane:0,slide:0,vx:0,vyv:0}; S.speed=0; S.baseSpeed=16; S.runCoins=0; S.shake=0; S.paused=false;
S.init=()=>{
  const cv=document.getElementById('c'); S.renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true}); S.renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  S.scene=new THREE.Scene(); S.camera=new THREE.PerspectiveCamera(62,1,.1,400); W.init(S.scene);
  S.shieldMesh=new THREE.Mesh(new THREE.SphereGeometry(1.7,24,16),new THREE.MeshBasicMaterial({color:0x6ad0ff,transparent:true,opacity:.28,depthWrite:false})); S.shieldMesh.visible=false; S.scene.add(S.shieldMesh);
  const rs=()=>{ const w=innerWidth,h=innerHeight; S.renderer.setSize(w,h,false); S.camera.aspect=w/h; S.camera.fov=w/h<.8?75:62; S.camera.updateProjectionMatrix(); }; addEventListener('resize',rs); rs();
  // keyboard
  addEventListener('keydown',e=>{ if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault(); if(e.repeat) return; S.keys[e.key.toLowerCase()]=true; S.onKey(e.key.toLowerCase()); });
  addEventListener('keyup',e=>{ S.keys[e.key.toLowerCase()]=false; });
  // pointer (drag to steer in 3D modes, swipe in ground mode)
  let sx,sy,down=false; cv.addEventListener('pointerdown',e=>{ down=true; sx=e.clientX; sy=e.clientY; A.init(); });
  cv.addEventListener('pointermove',e=>{ if(!down||S.state!=='play'||S.animal.mode==='ground') return; S.P.x=Math.max(-6,Math.min(6,S.P.x+(e.clientX-sx)*.03)); S.P.y=Math.max(1,Math.min(9,S.P.y-(e.clientY-sy)*.03)); sx=e.clientX; sy=e.clientY; });
  cv.addEventListener('pointerup',e=>{ if(!down) return; down=false; if(S.state!=='play'||S.animal.mode!=='ground') return; const dx=e.clientX-sx, dy=e.clientY-sy; if(Math.abs(dx)<30&&Math.abs(dy)<30) return; if(Math.abs(dx)>Math.abs(dy)) S.onKey(dx>0?'arrowright':'arrowleft'); else S.onKey(dy<0?'arrowup':'arrowdown'); });
  cv.addEventListener('wheel',e=>{ S.zoom=Math.max(.7,Math.min(1.8,S.zoom+e.deltaY*.001)); },{passive:true});
  S.thumbs(); S.preview(ANIMALS.find(a=>a.id===S.save.sel)||ANIMALS[1]); S.buildMenu();
  let last=performance.now(); const loop=(t)=>{ requestAnimationFrame(loop); const dt=Math.min(.05,(t-last)/1000); last=t; if(!S.paused) S.frame(dt); }; requestAnimationFrame(loop);
};
S.onKey=(k)=>{ if(k==='p'&&S.state==='play'){ S.paused=!S.paused; document.getElementById('pause').hidden=!S.paused; return; } if(k==='m'){ A.on=!A.on; return; } if(k==='['||k==='-') S.zoom=Math.min(1.8,S.zoom+.1); if(k===']'||k==='=') S.zoom=Math.max(.7,S.zoom-.1);
  if(S.state!=='play'||S.phase==='intro') return; const P=S.P;
  if(S.animal.mode==='ground'){ if(k==='arrowleft'||k==='a') P.lane=Math.max(-1,P.lane-1); if(k==='arrowright'||k==='d') P.lane=Math.min(1,P.lane+1);
    if(k==='arrowup'||k==='w'||k===' '){ if(P.y<=.02){ P.vy=11.5+(S.fx.boost>0||S.fx.boots>0?2:0); A.sfx('jump'); P.slide=0; } }
    if(k==='arrowdown'||k==='s'){ if(P.y>.05) P.vy=-20; else { P.slide=.75; A.sfx('slide'); } } }
  if(k==='shift'||k==='e'||k==='enter'||(k===' '&&S.animal.mode!=='ground')) S.useAbility(); };
S.useAbility=()=>{ if(S.abilityMeter<100||S.fx.dash>0||S.phase!=='chase') return; S.abilityMeter=0; S.fx.dash=1.8+(S.fx.extend?1:0); A.sfx('power'); S.say(S.animal.ability+'!',1200,'good'); S.burst(S.model.position.clone().add(new THREE.Vector3(0,1.5,0)),'#ffffff',24,7); };

// ---------- start / end ----------
S.preview=(a)=>{ if(S.model) S.scene.remove(S.model); [S.thiefModel,S.gem].forEach(o=>o&&S.scene.remove(o)); S.animal=a; S.model=M.build(a); M.setCap(S.model,false); S.scene.add(S.model); W.setTheme(a.hab,a.mode); S.state='menu'; S.P.z=0; S.P.x=0; S.P.y=a.mode==='ground'?0:4; S.model.position.set(0,S.P.y,0); S.reset(); };
S.start=(a)=>{ A.init(); S.preview(a); S.state='play'; S.P={x:0,y:a.mode==='ground'?0:5,z:0,vy:0,lane:0,slide:0,vx:0,vyv:0}; S.score=0; S.dist=0; S.hearts=3; S.fx={}; S.combo=0; S.chase=0; S.abilityMeter=40; S.assist=0; S.runCoins=0; S.foods=0; S.nearMiss=0; S.speedDip=0; S.shake=0; S.lastHit=-9; S.fxMax={}; S.reset(); M.setCap(S.model,false);
  S.model.position.set(0,S.P.y,0); S.beginChase(); W.setTheme(a.hab,a.mode); A.setAmbient(a.mode,W.T.fx); S.paused=false; document.getElementById('menu').hidden=true; document.getElementById('over').hidden=true; document.getElementById('hud').hidden=false; document.getElementById('pause').hidden=true; };
S.gameOver=()=>{ S.state='over'; S.phase='over'; document.body.classList.remove('chasing'); const earned=Math.floor(S.score/250)+S.runCoins; const sv=S.save; const newBest=S.score>sv.best; if(newBest) sv.best=Math.floor(S.score);
  const ms=S.missions(); let bonus=0; ms.forEach(m=>{ if(m.done) bonus+=80; }); sv.coins+=earned+bonus; S.persist();
  document.getElementById('hud').hidden=true; const o=document.getElementById('over'); o.hidden=false;
  document.getElementById('ovScore').textContent=Math.floor(S.score).toLocaleString(); document.getElementById('ovBest').textContent=newBest?'New best score!':'Best '+sv.best.toLocaleString();
  document.getElementById('ovStats').innerHTML=`<li><b>${Math.floor(S.dist).toLocaleString()} m</b> travelled</li><li><b>${S.chase-1}</b> treasures recovered</li><li><b>${S.foods}</b> foods collected</li><li><b>+${earned+bonus}</b> paw coins</li>`;
  document.getElementById('ovMissions').innerHTML=ms.map(m=>`<li class="${m.done?'done':''}">${m.txt} <span>${Math.min(m.cur,m.goal)}/${m.goal}</span></li>`).join(''); A.sfx('hit'); };
S.missions=()=>[{txt:'Collect 15 foods',cur:S.foods,goal:15},{txt:'Make 5 near misses',cur:S.nearMiss,goal:5},{txt:'Recover a treasure',cur:S.chase-1,goal:1},{txt:'Travel 2,500 m',cur:Math.floor(S.dist),goal:2500}].map(m=>(m.done=m.cur>=m.goal,m));

// ---------- per-frame ----------
S.frame=(dt)=>{
  const P=S.P, mode=S.animal.mode, vol=mode!=='ground';
  if(S.state==='menu'){ S.t=(S.t||0)+dt; S.model.rotation.y=Math.PI+Math.sin(S.t*.7)*.6+.3; M.animate(S.model,dt,{speed:.6}); const m=S.model.position;
    S.camera.position.set(Math.sin(S.t*.25)*1.2,(vol?P.y:0)+2.2,6.2); S.camera.lookAt(0,(vol?P.y:0)+1.1,0); W.update(dt,0,S.camera.position); S.renderer.render(S.scene,S.camera); return; }
  const base=S.baseSpeed=16+Math.min(14,S.dist/400); const ph=S.phase;
  // timers
  for(const k in S.fx){ if(k==='phoenix'||k==='extend') continue; if(S.fx[k]>0){ S.fx[k]-=dt; if(S.fx[k]<=0){ S.fx[k]=0; S.endFx(k); if(k==='dash') S.model.userData.rolling=false; } } }
  S.speedDip=Math.max(0,(S.speedDip||0)-dt);
  let sp=ph==='intro'?0:ph==='recover'?base*.8:base*S.speedMult()*(S.speedDip>0?.6:1);
  S.speed+= (sp-S.speed)*Math.min(1,dt*(sp>S.speed?3:6)); const ts=S.fx.time>0?.4:1;
  const step=S.speed*dt; P.z-=step; S.dist+=step;
  if(ph==='chase'||ph==='recover'){ S.addScoreRaw=step*.6*(S.fx.star>0?2:1); S.score+=S.addScoreRaw; S.abilityMeter=Math.min(100,S.abilityMeter+dt*6); }
  // movement
  if(ph!=='intro'){ if(!vol){ const tx=P.lane*LANE; P.x+=(tx-P.x)*Math.min(1,dt*13); P.vy-=32*dt; P.y+=P.vy*dt; if(P.y<0){P.y=0;P.vy=0;} if(P.slide>0) P.slide-=dt; }
    else { const K=S.keys, ax=((K.arrowright||K.d)?1:0)-((K.arrowleft||K.a)?1:0), ay=((K.arrowup||K.w)?1:0)-((K.arrowdown||K.s)?1:0); const spd=9+(S.fx.wings>0||S.fx.aqua>0?3:0);
      P.vx+=(ax*spd-P.vx)*Math.min(1,dt*7); P.vyv+=(ay*spd*.8-P.vyv)*Math.min(1,dt*7); P.x+=P.vx*dt; P.y+=P.vyv*dt;
      if(S.inZone('wind')) P.x+=3.2*dt; if(S.inZone('thermal')) P.y+=4*dt;
      P.x=Math.max(-6.5,Math.min(6.5,P.x)); P.y=Math.max(1,Math.min(mode==='swim'?9.6:10,P.y));
      if(mode==='swim'&&P.y>9.3&&(S.surfT||0)<=0){ S.surfT=2; S.addScore(100); S.say('Surface leap!',900); S.burst(S.model.position,'#ffffff',20,6); } S.surfT=(S.surfT||0)-dt; } }
  // model
  const mdl=S.model; mdl.position.set(P.x,P.y,P.z); const cp=S.capPop; if(cp>0){ S.capPop-=dt; const s=1+Math.sin(cp*8)*.5; mdl.userData.parts.cap.scale.setScalar(Math.max(.01,Math.min(1.5,s))); } else mdl.userData.parts.cap.scale.setScalar(1);
  mdl.userData.parts.head.scale.lerp(new THREE.Vector3(1,1,1),dt*8);
  if(ph!=='intro'&&ph!=='recover') M.animate(mdl,dt,{speed:S.speed/base,airborne:!vol&&P.y>.1,sliding:!vol&&P.slide>0&&P.y<.1,rolling:!vol&&P.slide>0&&S.animal.id==='hedgehog',bank:P.vx/9,pitch:P.vyv/9});
  S.shieldMesh.position.set(P.x,P.y+1.2,P.z); S.shieldMesh.material.opacity=.22+Math.sin(performance.now()*.008)*.08; if(S.fx.shield>0&&S.fx.shield<2) S.shieldMesh.visible=Math.floor(S.fx.shield*8)%2===0;
  // trail
  S.trT=(S.trT||0)-dt; if(S.trT<=0&&S.speed>1){ S.trT=.07; const col=mode==='swim'?'#bfe8ff':mode==='fly'?'#ffffff':'#d8c090'; S.burst(new THREE.Vector3(P.x,P.y+(vol?.8:.1),P.z+1),(S.fx.boots>0||S.fx.boost>0)?'#ffe45a':col,1,.8,.35); }
  // phases
  if(ph==='intro') S.updateIntro(dt); else if(ph==='chase'){ S.updateThief(dt); S.updateObjects(dt,ts); S.updateSpawns(dt); } else if(ph==='recover'){ S.updateRecover(dt); S.updateObjects(dt,ts); S.updateSpawns(dt); }
  S.updateSparks(dt);
  // camera
  const z=S.zoom, cy=(vol?P.y*.85:P.y*.3)+(ph==='intro'?2.6:4.1)*z, cz=P.z+(ph==='intro'?7:9.6)*z; const cam=S.camera; const tp=new THREE.Vector3(P.x*.65,cy,cz); cam.position.lerp(tp,Math.min(1,dt*7));
  if(S.shake>0){ S.shake-=dt*2; cam.position.x+=rnd(-1,1)*S.shake*.4; cam.position.y+=rnd(-1,1)*S.shake*.3; }
  cam.lookAt(P.x*.5,(vol?P.y:0)+1.3,P.z-14); const fovT=(S.camera.aspect<.8?75:62)+(S.speed/base-1)*18; cam.fov+=(fovT-cam.fov)*Math.min(1,dt*4); cam.updateProjectionMatrix();
  W.update(dt,P.z,cam.position);
  A.musicTick(Math.min(1,(S.thief?Math.min(1,S.thief.gap/45):0)*.7+(S.dist/6000)));
  S.renderer.render(S.scene,S.camera); S.hudT=(S.hudT||0)-dt; if(S.hudT<=0){ S.hudT=.08; S.hud(); }
};
// ===== GAME PART D: object update + collisions, HUD, menu =====
S.updateObjects=(dt,ts)=>{ const P=S.P, mode=S.animal.mode, vol=mode!=='ground', mag=S.fx.magnet>0; const T=performance.now()/1000;
  for(let i=S.objs.length-1;i>=0;i--){ const o=S.objs[i], m=o.m;
    if(o.dead||o.z>P.z+14){ if(o.dead&&(o.t==='ob'||o.t==='gate'||o.t==='pillar')) S.burst(m.position,'#cccccc',10,5,.5); release(m); S.objs.splice(i,1); continue; }
    if(o.t==='coin'||o.t==='food'||o.t==='super'||o.t==='power'){
      if(mag&&o.t!=='power'&&Math.abs(o.z-P.z)<16){ const k=Math.min(1,dt*6); o.z+=(P.z-o.z)*k; o.x+=(P.x-o.x)*k; o.y+=((P.y+(vol?.5:1))-o.y)*k; }
      m.position.set(o.x,o.y+Math.sin(T*3+o.z)*.15,o.z); if(o.t==='coin') m.rotation.y+=dt*4;
      if(Math.abs(o.z-P.z)<1.4&&Math.abs(o.x-P.x)<1.7&&Math.abs(o.y-(P.y+(vol?.5:1.1)))<(vol?1.9:1.7)) S.collect(o); }
    else if(o.t==='ob'){ if(o.mover){ o.ph+=dt*ts*1.4; o.x=Math.sin(o.ph)*LANE*1.1; m.position.set(o.x,0,o.z); m.rotation.z-=dt*ts*5; } 
      if(Math.abs(o.z-P.z)<1.15){ const sameLane=o.all||(o.mover?Math.abs(o.x-P.x)<1.7:Math.abs(o.lane*LANE-P.x)<1.5); if(sameLane){ const k=o.kind; let hit=false;
          if(k==='low') hit=P.y<1.0; else if(k==='high') hit=!(P.slide>0&&P.y<.1); else hit=P.y<2.3; if(hit){ S.hit(o); if(!(S.fx.shield>0)&&!o.hitDone){ o.hitDone=true; } } } } }
    else if(o.t==='gate'){ if(o.mover) {} const dz=o.z-P.z; if(!o.done&&dz>-.4&&dz<1){ o.done=true; const d=Math.hypot(P.x-o.hx,(P.y+(vol?.6:0))-o.hy); if(d>o.R-.55) S.hit(o); else { S.combo++; S.addScore(20); if(d>o.R-1.1){ S.nearMiss++; S.addScore(50); } } } }
    else if(o.t==='pillar'){ if(o.mover){ o.ph+=dt*ts*1.2; o.x=Math.sin(o.ph)*4.5; m.position.x=o.x; } if(Math.abs(o.z-P.z)<1.3&&Math.abs(o.x-P.x)<o.r+.9){ S.hit(o); } }
  } };

S.hud=()=>{ const $=id=>document.getElementById(id), th=S.thief; $('score').textContent=Math.floor(S.score).toLocaleString(); $('best').textContent=Math.max(S.save.best,Math.floor(S.score)).toLocaleString(); $('dist').textContent=Math.floor(S.dist).toLocaleString()+' m';
  $('hearts').innerHTML=Array.from({length:3},(_,i)=>`<i class="h ${i<S.hearts?'on':''}"></i>`).join('');
  const mult=(S.fx.star>0?2:1)*(1+Math.min(4,Math.floor(S.combo/8))); $('combo').textContent='Combo '+S.combo+(mult>1?'  x'+mult:'');
  $('ability').style.width=S.abilityMeter+'%'; $('abilityName').textContent=S.abilityMeter>=100?S.animal.ability+' ready (E)':S.animal.ability; $('ability').parentElement.classList.toggle('ready',S.abilityMeter>=100);
  if(th){ const g=th.gap; $('gap').textContent=Math.round(g)+' m'; $('gapfill').style.width=Math.max(4,Math.min(100,100-(g-3)/50*100))+'%'; $('thiefState').textContent=th.power>0?th.def.power+'!':th.tired>0?'Thief is tired':th.hidden?'Hidden in cover':'Chasing';
    $('thiefState').className=th.power>0?'hot':th.tired>0?'cool':''; const ar=$('compass'); const on=S.fx.compass>0; ar.hidden=!(on||th.hidden); if(!ar.hidden&&S.thiefModel){ const ang=Math.atan2(S.thiefModel.position.x-S.P.x,th.gap); ar.firstElementChild.style.transform=`rotate(${ang*57}deg)`; ar.lastElementChild.textContent=Math.round(g)+' m'; } }
  let h=''; for(const k in S.fx){ if(S.fx[k]>0&&POWERS[k]){ const P=POWERS[k], mx=(S.fxMax&&S.fxMax[k])||P.dur; h+=`<li style="--c:${P.c}"><b>${P.e}</b><span>${pname(k)}</span><em style="width:${Math.min(100,S.fx[k]/mx*100)}%"></em></li>`; } }
  if(S.fx.boost>0) h+=`<li style="--c:#ffd23a"><b>${SUPER_EMO(S.animal.food)}</b><span>${S.animal.food}</span><em style="width:${Math.min(100,S.fx.boost/8*100)}%"></em></li>`;
  if(S.fx.dash>0) h+=`<li style="--c:#fff"><b>💨</b><span>${S.animal.ability}</span><em style="width:${S.fx.dash/2.4*100}%"></em></li>`;
  if(S.fx.phoenix) h+=`<li style="--c:#ff8a3a"><b>🔥</b><span>Phoenix Feather ready</span><em style="width:100%"></em></li>`; $('powers').innerHTML=h; };

// thumbnails with caps on
S.thumbs=()=>{ S.thumbURL={}; try{ const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:true}); r.setSize(160,160); const sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,.1,50); sc.add(new THREE.HemisphereLight(0xffffff,0x8899aa,.75)); const d=new THREE.DirectionalLight(0xffffff,.55); d.position.set(2,4,5); sc.add(d);
  ANIMALS.forEach(a=>{ const m=M.build(a); M.setCap(m,false); m.rotation.y=Math.PI-.35; sc.add(m); const gr=a.mode==="ground"; cam.position.set(0,gr?1.9:1.3,gr?6.2:7.6); cam.lookAt(0,gr?1.1:.35,0); r.render(sc,cam); S.thumbURL[a.id]=r.domElement.toDataURL(); sc.remove(m); }); r.dispose(); }catch(e){} };

S.buildMenu=()=>{ const g=document.getElementById('grid'); const tabs=document.getElementById('tabs'); let cur='ground'; const modes={ground:'Runners',fly:'Flyers',swim:'Swimmers'};
  const render=()=>{ g.innerHTML=''; ANIMALS.filter(a=>a.mode===cur).forEach(a=>{ const un=S.save.unlocked.includes(a.id); const b=document.createElement('button'); b.className='card'+(a.id===S.save.sel?' sel':'')+(un?'':' lock'); b.innerHTML=`<img alt="" src="${S.thumbURL[a.id]||''}"><span>${a.name}</span>${un?'':`<em>${S.price(a)}</em>`}`; b.onclick=()=>{ S.save.sel=a.id; S.persist(); S.preview(a); render(); info(); }; g.appendChild(b); });
    tabs.querySelectorAll('button').forEach(t=>t.classList.toggle('on',t.dataset.m===cur)); document.getElementById('coins').textContent=S.save.coins.toLocaleString(); };
  tabs.innerHTML=Object.keys(modes).map(k=>`<button data-m="${k}">${modes[k]}</button>`).join(''); tabs.onclick=e=>{ const m=e.target.dataset.m; if(m){ cur=m; render(); } };
  const info=()=>{ const a=S.animal, un=S.save.unlocked.includes(a.id); document.getElementById('aname').textContent=a.name; document.getElementById('aline').textContent=({ground:'Runs',fly:'Flies',swim:'Swims'})[a.mode]+' through the '+a.hab.replace(/\d/,'').replace(/^./,c=>c.toUpperCase())+' habitat';
    document.getElementById('adetail').innerHTML=`<li><span>Loves</span>${a.food}</li><li><span>Treasure</span>${a.treasure}</li><li><span>Thief</span>${a.thief} (${a.power})</li><li><span>Ability</span>${a.ability}</li>`;
    const pb=document.getElementById('play'); pb.textContent=un?'Start the chase':'Unlock for '+S.price(a)+' coins'; pb.className=un?'':'buy'; };
  document.getElementById('play').onclick=()=>{ const a=S.animal; if(!S.save.unlocked.includes(a.id)){ const p=S.price(a); if(S.save.coins>=p){ S.save.coins-=p; S.save.unlocked.push(a.id); S.persist(); render(); info(); } else { document.getElementById('play').textContent='Need '+(p-S.save.coins)+' more coins'; } return; } S.start(a); };
  document.getElementById('again').onclick=()=>S.start(S.animal); document.getElementById('tomenu').onclick=()=>{ document.getElementById('over').hidden=true; document.getElementById('menu').hidden=false; document.getElementById('hud').hidden=true; S.preview(S.animal); render(); info(); };
  document.getElementById('resume').onclick=()=>S.onKey('p');
  // upgrades
  const ups=[['shield','Shield time'],['magnet','Magnet time'],['boost','Boost time']]; const upEl=document.getElementById('ups'); const rUp=()=>{ upEl.innerHTML=ups.map(([k,n])=>{ const lv=S.save.up[k], cost=100*(lv+1); return `<button data-k="${k}" ${lv>=4?'disabled':''}><b>${n}</b><span>Lv ${lv}/4${lv<4?' · '+cost:''}</span></button>`; }).join(''); }; rUp();
  upEl.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; const k=b.dataset.k, lv=S.save.up[k], cost=100*(lv+1); if(lv<4&&S.save.coins>=cost){ S.save.coins-=cost; S.save.up[k]++; S.persist(); rUp(); render(); } };
  const a0=S.animal; cur=a0.mode; render(); info(); };
S.init();
</script>
